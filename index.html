<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Harsha Praveen">
    <title>TOP Landing Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/earth.png">
</head>

<body>
    <header>
        <h1>Header Logo</h1>
        <ul>
            <li><a href="#">header link one</a></li>
            <li><a href="#">header link two</a></li>
            <li><a href="#">header link three</a></li>
        </ul>
    </header>

    <section class="hero">
        <div class="left">
            <h2>This website is<br> awesome</h2>
            <p>This website has some subtext that goes here under the<br> main title. it's a smaller font and the
                color is lower<br> contrast</p>

            <button class="signup1">Sign up</button>
        </div>
        <div class="right">
            <img src="img/earth-space-hd.jpg" alt="Beautiful Earth Image" width="500">
        </div>
    </section>

    <section class="info">
        <h2>Some random information.</h2>

        <div class="content">
            <figure class="image-container">
                <img src="img/grand-canyon.jpg" alt="Grand Canyon Image" width="300" height="300" loading="lazy">
                <figcaption>Nature’s masterpiece, carved by time — the breathtaking Grand Canyon.</figcaption>
            </figure>

            <figure class="image-container">
                <img src="img/machu-picchu.jpg" alt="Machu Picchu Image" width="300" height="300" loading="lazy">
                <figcaption>Lost in the magic of Machu Picchu.</figcaption>
            </figure>

            <figure class="image-container">
                <img src="img/moraine-lake.jpg" alt="Moraine Lake Image" width="300" height="300" loading="lazy">
                <figcaption>Moraine Lake, unreal in every shade of blue.</figcaption>
            </figure>

            <figure class="image-container">
                <img src="img/victoria-falls.jpg" alt="Victoria Falls Image" width="300" height="300" loading="lazy">
                <figcaption>Victoria Falls, nature at its wildest.</figcaption>
            </figure>
        </div>
    </section>
</body>

</html>
